apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-backend

  template:
    metadata:
      labels:
        app: employee-backend

    spec:
      containers:
      - name: employee-backend
        image: pinkyma1107/employee-backend:latest
        ports:
        - containerPort: 5000
