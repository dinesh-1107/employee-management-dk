version: "3.9"

services:
  frontend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--spider","http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--spider","http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql:
    restart: unless-stopped
