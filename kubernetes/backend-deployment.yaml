apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-backend
  namespace: employee-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-backend

  template:
    metadata:
      labels:
        app: employee-backend

    spec:
      containers:
        - name: backend
          image: employee-management-dk-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: DB_PASSWORD

            - name: DB_NAME
              value: employee_db